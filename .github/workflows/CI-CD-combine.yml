name: CI-CD-combinegti 

on:
  push:
    branches: ["dev/feature/auth"]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      PORT: ${{ vars.PORT }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      JWT_REFRESH_EXPIRE: ${{ vars.JWT_REFRESH_EXPIRE }}
      JWT_EXPIRE: ${{ vars.JWT_EXPIRE }}

      NODE_ENV: ${{ vars.NODE_ENV }}

      EMAIL_HOST: ${{ vars.EMAIL_HOST }}
      EMAIL_PORT: ${{ vars.EMAIL_PORT }}
      EMAIL_USER: ${{ vars.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      MONGODB_URI: ${{ secrets.MONGODB_URI }}

      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}

    steps:
      - uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Set version
        run: |
          echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_BE=peppa2k3/vite-template-backend" >> $GITHUB_ENV
          echo "IMAGE_FE=peppa2k3/vite-template-frontend" >> $GITHUB_ENV
      - name: build & push backend
        run: |
          docker build -t peppa2k3/vite-template-backend:${{env.VERSION}} ./backend
          docker push peppa2k3/vite-template-backend:${{env.VERSION}}
      - name: build & push frontend
        run: |
          docker build -t peppa2k3/vite-template-frontend:${{env.VERSION}} ./frontend
          docker push peppa2k3/vite-template-frontend:${{env.VERSION}}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_KEY}}
          script: |
            cd /opt/vite-template
            docker compose down
            echo "IMAGE_BE=${{env.IMAGE_BE}}:${{env.VERSION}} "> .env
            echo "IMAGE_FE=${{env.IMAGE_FE}}:${{env.VERSION}} ">> .env
            cat .env
            docker compose pull
            docker compose up -d
            docker image prune -f
